           clipTo(m,()=>texture(tex,S,r,unit,{v0:-0.10,v1:1.0,dens:1.25})); }
    hairline(m,r);
    furEdge(S,r,unit,m,{n:Math.round(rr(4,11)),len:0.024,upTo:0.55});
    return;
  }
  if(kind==="chinstrap"){                          // a band following the jaw rim
    const d=rr(-0.14,0.04);
    const out=cap(S,{dir:1,span:1,rad:rr(1.02,1.05),drop:d});
    const inn=cap(S,{dir:1,span:1,rad:rr(0.82,0.88),drop:d});
    fillPts(out.concat(inn.slice().reverse()),INK,0.9);
    stroke(out,r,{w:1.9,amp:0.016,close:true});
    return;
  }
  if(kind==="goatee"){                             // chin patch, clear of the mouth
    const m=cap(S,{dir:1,span:rr(0.34,0.50),rad:rr(1.02,1.06),
                   drop:rr(-0.24,-0.10),...clumps(r)});
    if(tex==="solid") fillPts(m,INK,0.96);
    else { fillPts(m,PAPER); clipTo(m,()=>texture(tex,S,r,unit,{v0:0.3,v1:1.0,dens:1.6})); }
    stroke(m,r,{w:2.15,amp:0.018,close:true});
    return;
  }
  if(kind==="soulpatch"){
    const A=pin(S,anchor(S,0,0.52),0.72);
    const p=clampPts(S,[place(A,-unit*0.022,-unit*0.020),place(A,unit*0.022,-unit*0.020),
                        place(A,unit*0.016,unit*0.030),place(A,-unit*0.016,unit*0.030)],0.90);
    fillPts(p,INK,0.93); stroke(p,r,{w:1.2,close:true,amp:0.04});
    return;
  }
  if(kind==="sideburns"){
    for(const s of [-1,1]){
      const A=anchor(S,s*0.235,-0.04);
      if(!seen(A,ROLE.EDGE)) continue;
      const B=pin(S,A,0.94);
      const p=[place(B,s*unit*0.010,-unit*0.030),place(B,s*unit*0.050,-unit*0.016),
               place(B,s*unit*0.044,unit*0.075),place(B,s*unit*0.004,unit*0.058)];
      fillPts(p,INK,0.92); stroke(p,r,{w:1.4,close:true,amp:0.035});
    }
    return;
  }
}
const MOUSTACHES=["none","none","none","none","none","none","walrus","pencil",
                  "toothbrush","horseshoe","handlebar"];
function drawMoustache(g,S,r,unit){
  const kind=g.moustache;
  if(kind==="none") return;
  const rr=R(r), A0=anchor(S,0,g.mousV);
  if(!seen(A0,ROLE.FEATURE)) return;
  const A=pin(S,A0,0.56);                          // R1: keep it on the face
  const w=unit*rr(0.052,0.084), h=unit*rr(0.010,0.020);
  if(kind==="toothbrush"){
    const p=clampPts(S,[place(A,-w*0.30,-h),place(A,w*0.30,-h),
                        place(A,w*0.30,h),place(A,-w*0.30,h)],0.90);
    fillPts(p,INK,0.95); stroke(p,r,{w:1.4,close:true,amp:0.035}); return;
  }
  if(kind==="pencil"){
    for(const s of [-1,1])
      stroke([place(A,s*w*0.10,0),place(A,s*w,-h*0.30)],r,{w:2.2,amp:0.045,alpha:0.95});
    return;
  }
  if(kind==="handlebar"){                          // curls UP at the ends
    for(const s of [-1,1]){
      const p=[place(A,s*w*0.06,h*0.2),place(A,s*w*0.62,h*0.5),
               place(A,s*w*1.02,-h*0.3),place(A,s*w*0.80,-h*1.5)];
      stroke(p,r,{w:2.2,amp:0.05,alpha:0.95});
    }
    return;
  }
  // walrus / horseshoe: a lens that droops, heavier toward the ends
  const droop=kind==="horseshoe"?rr(1.4,2.2):rr(0.4,0.9);
  const p=[];
  for(let i=0;i<=12;i++){const t=-1+2*i/12; p.push(place(A,t*w,-h*(1-t*t)*0.9));}
  for(let i=12;i>=0;i--){const t=-1+2*i/12;
    p.push(place(A,t*w,h*(0.45+0.55*t*t)+h*droop*t*t));}
  fillPts(p,INK,0.95); stroke(p,r,{w:1.5,close:true,amp:0.028});
  if(kind==="horseshoe") for(const s of [-1,1]){   // tails past the mouth corners
    const q=[place(A,s*w*0.90,h*1.1),place(A,s*w*0.98,h*2.3+unit*0.026),
             place(A,s*w*0.66,h*2.1+unit*0.026),place(A,s*w*0.62,h*1.0)];
    fillPts(q,INK,0.95); stroke(q,r,{w:1.3,close:true,amp:0.035});
  }
}

/* ── interior lines ─────────────────────────────────────────────────────
   The reference faces carry far more line than mine did: a long bridge running
   from between the brows to the tip of the nose, a cheek curve, a crease under
   the lip, jowls. They are most of what makes those heads read as CONSTRUCTED
   rather than as an oval with features dropped into it. */
const FACELINES=["none","none","none","bridge","bridge","browbridge",
                 "cheek","jowl","crease"];
function faceLines(S,r,unit,g){
  const rr=R(r), k=g.faceLine;
  if(k==="none") return;
  if(k==="bridge"||k==="browbridge"){
    const A=pin(S,anchor(S,g.noseU-0.013,g.noseV-(k==="browbridge"?0.44:0.27)),0.70);
    const B=pin(S,anchor(S,g.noseU-0.010,g.noseV+0.02),0.70);
    stroke([[A.x,A.y],[B.x,B.y]],r,{w:1.5,alpha:0.85,amp:0.035});
    return;
  }
  if(k==="cheek"){
    const s=r()<0.5?-1:1, C=pin(S,anchor(S,s*0.17,0.20),0.80);
    stroke(arc(C.x,C.y,unit*rr(0.05,0.09),unit*rr(0.09,0.15),
               s<0?1.1:2.0,s<0?2.6:3.6,12),r,{w:1.3,alpha:0.70,amp:0.035});
    return;
  }
  if(k==="jowl"){ for(const s of [-1,1]){
    const C=pin(S,anchor(S,s*0.13,0.42),0.80);
    stroke(arc(C.x,C.y,unit*0.055,unit*0.075,1.5,3.0,10),r,{w:1.3,alpha:0.65,amp:0.04});
  } return; }
  if(k==="crease"){
    const C=pin(S,anchor(S,g.mouthU,g.mouthV+0.16),0.74);
    stroke(arc(C.x,C.y,unit*rr(0.04,0.07),unit*0.02,3.4,6.0,10),r,{w:1.3,alpha:0.7,amp:0.045});
  }
}

/* ── glasses ─────────────────────────────────────────────────────────────
   Rims are worn but sit on the face, so R1 clamps them in; the temple arms are
   the part that leaves the form, so R2 pushes those out to the rim. The bridge
   joins the INNER edges of the two rims — joining the anchors, which is what
   it used to do, drew a line straight through both pupils. */
function drawGlasses(S,r,unit,g){
  const rr=R(r), J=g.J;
  // the rims live inside the room the layout pass allotted the eyes
  const rG=Math.min(unit*rr(0.052,0.066), g.eyeRoom*0.92);
  const A=[0,1].map(i=>anchor(S,(i?1:-1)*(g.eyeSpread+J.eyeDU[i]),g.eyeV+J.eyeDV[i]));
  const P=A.map(a=>pin(S,a,0.70));
  A.forEach((a,i)=>{ if(!seen(a,ROLE.FEATURE)) return;
    stroke(arc(P[i].x,P[i].y,rG*J.eyeK[i],rG*0.92*J.eyeK[i],0,6.29,26,J.eyeT[i]*0.3),
      r,{w:1.5,close:true,amp:0.026,alpha:0.9}); });
  if(seen(A[0],ROLE.FEATURE)&&seen(A[1],ROLE.FEATURE)){
    const dx=P[1].x-P[0].x, dy=P[1].y-P[0].y, d=Math.hypot(dx,dy)||1;
    stroke([[P[0].x+dx/d*rG,P[0].y+dy/d*rG],[P[1].x-dx/d*rG,P[1].y-dy/d*rG]],
      r,{w:1.3,passes:1,amp:0.05});
  }
  A.forEach((a,i)=>{ if(a.facing<0.25) return;    // arm gone once it swings round
    const s=i?1:-1;
    stroke([place(P[i],s*rG*1.05,0),
            toForm(S,...place(P[i],s*rG*2.5,-unit*0.006),1.0,"out")],
      r,{w:1.2,passes:1,alpha:0.8,amp:0.05}); });
}

/* ---- SUBJECT: heads (ellipsoid) ---- */
const HEAD={
  name:"Heads", solid:"ellipsoid", shapes:SHAPES,
  cols:6, rows:4, fillK:[0.92,0.99], ryK:0.375,
  build(r,S){
    const rr=R(r), pick=PICK(r), ch=CHANCE(r);

    /* ── the wonk ──────────────────────────────────────────────────────
       A big table of variants is not enough on its own. Pick a style per part
       and stamp each one at its canonical anchor and the result is Mr Potato
       Head: forty faces with interchangeable pieces in identical sockets. So
       every part ALSO gets its own offset, scale and rotation — per side — and
       the two halves of a face are never allowed to agree. The style table
       gives range; this gives the hand. */
    const pair=(a,b)=>[rr(a,b),rr(a,b)];
    const mo=pick(MOUSTACHES), es=pick(EYES), htex=pick(HAIRTEX);
    /* The vertical jitter is the component that causes collisions, so most of
       the wonk now lives on the axes that CANNOT collide — sideways, size and
       rotation. Same amount of character, far less pile-up. */
    const J={
      eyeDU: pair(-0.019,0.019),        // around the solid
      eyeDV: pair(-0.030,0.030),        // up and down it — kept modest
      eyeK:  pair(0.80,1.24),           // size
      eyeT:  pair(-0.40,0.40),          // rotation
      browDV:pair(-0.030,0.030), browK:pair(0.78,1.24), browT:pair(-0.36,0.36),
      earDV: pair(-0.05,0.05), earK: pair(0.82,1.24)
    };
    /* ── R4: pack the face before anything is drawn ──────────────────────
       Half-heights are the part's real drawn extent divided by S.ry, since the
       stack works in units of ry. The constants come straight out of the part
       functions above: an eye is about 0.85 of its `size` tall, the hook nose
       runs 1.4 of its `size`, and so on. */
    const eyeSize0=rr(0.80,1.40), noseLen0=rr(0.55,1.30), mouthW0=rr(0.072,0.130);
    const browK0=Math.max(...J.browK), esp0=rr(0.074,0.120);
    const RY=S.ry/S.unit;                          // never hardcode this twice
    const st=[
      {k:"brow", y:yOfV(rr(-0.40,-0.24)), h:0.085*browK0*0.50/RY},
      {k:"eye",  y:yOfV(rr(-0.17,-0.02)), h:0.085*eyeSize0*0.85/RY},
      {k:"nose", y:yOfV(rr(0.02,0.17)),   h:0.100*noseLen0*0.70/RY},
    ];
    if(mo!=="none") st.push({k:"mous", y:yOfV(0.24), h:0.048/RY});
    st.push({k:"mouth", y:yOfV(rr(0.30,0.46)), h:mouthW0*0.45/RY});
    const squeeze=packStack(st,-0.78,0.84);
    const Y={}; for(const it of st) Y[it.k]=vOfY(it.y);

    /* Horizontal: the eye pair, solved on the ACTUAL projected anchors rather
       than estimated, because build has the solid in hand — so it is exact
       whatever the head shape or turn.

       `eyeSpread` is an ANGLE around the solid, which means the same value put
       the eyes near the nose on a narrow skull and out at the temples on a wide
       one. So aim for a target separation in PAGE terms and solve for the angle
       that gets there. Then size the eyes to the room they turned out to have,
       rather than picking a size and hoping it fits. */
    const gl=ch(0.16);
    const targetSep=S.unit*rr(0.165,0.245);
    let esp=esp0;
    for(let i=0;i<16;i++){
      const A=anchor(S,-esp,Y.eye), B=anchor(S,esp,Y.eye);
      const d=Math.hypot(B.x-A.x,B.y-A.y);
      if(Math.abs(d-targetSep)<S.unit*0.010) break;
      esp=Math.max(0.040,Math.min(0.20, esp*(d>targetSep?0.91:1.09)));
    }
    const maxR=Math.max(S.unit*0.030,(targetSep-S.unit*0.016)/2);
    const eyeSize=Math.min(eyeSize0, maxR/(S.unit*0.085));

    // Eye height first, because the hairline is derived FROM it: a hairline
    // rolled blind lands on the eyes about one time in seven, and a rule that
    // cannot fail beats a gate that has to notice.
    const eyeV=Y.eye, eyeY=Math.sin(eyeV*Math.PI/2);
    return { J, eyeV, squeeze,
      browV:Y.brow, noseV:Y.nose, mousV:Y.mous!==undefined?Y.mous:0.24,
      mouthV:Y.mouth, glasses:gl,
      hair: pick(HAIRSHAPES), hairTex: htex, strays: ch(0.50),
      hairDrop: eyeY-rr(0.17,0.46), hairTilt: rr(-0.12,0.12),
      faceLine: pick(FACELINES),
      beard: pick(BEARDS), beardTex: htex, moustache: mo,
      eyeStyle: es, wink: ch(0.09),
      browStyle: pick(BROWS), brow: ch(0.74),
      noseStyle: pick(NOSES), mouthStyle: pick(MOUTHS),
      earStyle: pick(HEAR),
      eyeSpread: esp, eyeSize, eyeRoom: maxR,
      noseU: rr(-0.017,0.017), noseLen: noseLen0,
      mouthU: rr(-0.024,0.024), mouthW: mouthW0, mouthT: rr(-0.24,0.24),
      tint: ch(0.34)?pick(TINTS):null, freckles: ch(0.18),
      shade: ch(0.50)?Math.round(rr(16,34)):0
    };
  },

  /* ── the gates ─────────────────────────────────────────────────────────
     Borrowed from Strays: generate, then judge, and throw the bad ones away.
     A gate is cheaper and far more honest than narrowing every parameter range
     until nothing can go wrong — the ranges stay expressive and only the bad
     corners get rejected. A cell that fails any gate is rerolled with a new
     seed; the footer reports which gates fired, because a gate that never
     fires is a gate you do not need. */
  gates:[
    // Total black must land in a readable band: not a silhouette, not a blank
    // egg. A low fringe counts, because it is ink whatever the style is called.
    ["contrast", g=>{
      // the utensil carries value of its own: a marker brings weight that a
      // technical pen does not, so the spec has to make up the difference
      const tw=(tool==="marker"||tool==="brush")?1:
               (tool==="tech"||tool==="pencil")?-1:0;
      const s=hairInk(g)+BEARDINK[g.beard]*(g.beardTex==="solid"?1:0.7)+
              (g.moustache!=="none"?1:0)+
              (g.glasses?1:0)+(g.shade?1:0)+tw+
              (MASS.has(g.hair)&&g.hairTex==="solid"&&g.hairDrop>-0.34?1:0);
      return s>=2 && s<=7;
    }],
    // Parts that turn to mush when stacked on each other.
    ["collision", g=>
      !(g.glasses && ["wide","boggle","ring","spiral","star"].includes(g.eyeStyle)) &&
      !(g.moustache!=="none" && ["oh","gape"].includes(g.mouthStyle)) &&
      !(g.beard==="full" && g.moustache!=="none")],
    // If the packer had to shove things a long way, the spec was never going
    // to sit on this head — better to reroll than to draw a squashed face.
    ["cramped", g=> g.squeeze < 0.55],
    // A face needs something in it.
    ["blank", g=> !(g.noseStyle==="none" && !g.brow &&
      ["closed","pinhole"].includes(g.eyeStyle))]
  ],
  tag: g=>g.hair+"/"+g.hairTex,

  draw(r,S,g,unit){
    const rr=R(r), J=g.J;
    const sil=outline(S);
    if(g.tint) tintPatch(S,r,unit,g.tint,sil);
    // R2: ears are attached, so they go on BEFORE the outline — which also
    // lets a hat drawn later cover them, the way a hat does
    drawEars(S,r,unit,g.earStyle,J);
    // form shading, clipped to the real outline so tone cannot leak off the form
    if(g.shade) clipTo(sil,()=>surfHatch(S,r,{v0:-0.30,v1:0.92,n:g.shade,
      du:0.05,dv:0.10,w:0.95,alpha:0.5,cut:-0.05}));
    stroke(sil,r,{w:3.0,passes:2,close:true,amp:0.011});
    drawHair(g,S,r,unit);
    drawBeard(g,S,r,unit);

    // a fringe covers the brows: a rule, not a coincidence
    const browsHidden=MASS.has(g.hair) && g.hairTex==="solid" &&
      g.hairDrop > Math.sin(g.browV*Math.PI/2);

    for(const [i,s] of [[0,-1],[1,1]]){
      const du=g.eyeSpread+J.eyeDU[i];
      const A0=anchor(S,s*du,g.eyeV+J.eyeDV[i]);
      if(!seen(A0,ROLE.FEATURE)) continue;
      const A=pin(S,A0,0.66);                                    // R1
      eye(A,r,s,{size:unit*0.085*g.eyeSize*J.eyeK[i]*(0.9+0.2*A.facing),
                 style:(g.wink&&i===1)?"closed":g.eyeStyle,
                 tilt:J.eyeT[i]*0.5, lid:anim.lid});
      if(g.brow && !browsHidden){
        const B=pin(S,anchor(S,s*du,g.browV+J.browDV[i]),0.72);
        brow(B,r,s,{size:unit*0.085*J.browK[i],style:g.browStyle,
                    tilt:J.browT[i]*0.4, S});
      }
    }
    if(g.glasses) drawGlasses(S,r,unit,g);

    const N0=anchor(S,g.noseU,g.noseV);
    if(seen(N0,ROLE.FEATURE))
      nose(pin(S,N0,0.64),r,{size:unit*0.10*g.noseLen,style:g.noseStyle});

    const M0=anchor(S,g.mouthU,g.mouthV);
    if(seen(M0,ROLE.FEATURE)){
      // only a solid mass buries the mouth; a combed one you can draw over
      const buried=g.beard==="full" && g.beardTex==="solid";
      mouth(pin(S,M0,0.66),r,{w:unit*g.mouthW, tilt:g.mouthT, smile:anim.smile,
        style:buried?"line":g.mouthStyle, col:buried?PAPER:INK});
    }
    drawMoustache(g,S,r,unit);
    faceLines(S,r,unit,g);

    // freckles sit on the cheeks: scattered across the middle they landed on
    // the nose and the mouth, which is the jumble this pass exists to stop
    if(g.freckles) for(const sd of [-1,1]){
      const F=pin(S,anchor(S,sd*0.16,g.noseV+0.06),0.74);
      for(let i=0;i<5;i++){
        const [x,y]=toForm(S,...place(F,rr(-0.6,0.6)*unit*0.09,
                                       rr(-0.5,0.5)*unit*0.07),0.84,"in");
        fillPts(arc(x,y,unit*0.008,unit*0.008,0,6.29,8),INK,0.7);
      } }
  }
};

/* ── cats ────────────────────────────────────────────────────────────────
   Sixteen kinds rather than one cat with a stripe toggle. A kind is a small
   set of overrides — coat, ear type, a default expression, the odd accessory —
   laid over the same jittered base, so a Siamese and a void cat are recognisably
   different animals while still being drawn by the same hand.

   The coat is where most of it lives, because value is what separates a tabby
   from a tuxedo from a hole in the paper. */
const CAT_KINDS={
  tabby:   {coat:"stripes", fur:0.40},
  tabby2:  {coat:"stripes", ears:"tufted", fur:0.55},
  tuxedo:  {coat:"tuxedo",  fur:0.30},
  void:    {coat:"void",    eyes:"boggle", fur:0.25},
  siamese: {coat:"points",  ears:"large",  eyes:"almond", fur:0.15},
  calico:  {coat:"patches", fur:0.45},
  fold:    {coat:"plain",   ears:"folded", fur:0.35},
  maine:   {coat:"fluff",   ears:"tufted", fur:1.00},
  lynx:    {coat:"fluff",   ears:"tall",   fur:0.85},
  sphynx:  {coat:"bare",    ears:"huge",   eyes:"squint", fur:0.00},
  persian: {coat:"fluff",   ears:"small",  eyes:"wide",   fur:1.00},
  kitten:  {coat:"plain",   ears:"large",  eyes:"boggle", fur:0.50},
  loaf:    {coat:"stripes", eyes:"closed", fur:0.60},
  grump:   {coat:"points",  eyes:"angry",  mouth:"frown", fur:0.30},
  pirate:  {coat:"tuxedo",  ears:"torn",   patch:true,    fur:0.35},
  dapper:  {coat:"plain",   monocle:true,  bowtie:true,   fur:0.20},
  oracle:  {coat:"void",    ears:"large",  eyes:"ring", thirdEye:true, fur:0.20},
  toothy:  {coat:"stripes", fangs:true,    fur:0.45},
  cloud:   {coat:"fluff",   ears:"small",  eyes:"dot",    fur:1.00},
};
const CAT_NAMES=Object.keys(CAT_KINDS);

/* One ear. `type` changes the silhouette; the jitter changes the pair. */
function catEar(S,r,unit,i,s,type,J,col){
  const rr=R(r);
  const A=anchor(S,s*(0.115+J.earDU[i]), -0.62+J.earDV[i]);
  if(A.facing<-0.10) return;
  // Sit the base ON the crown, a shade inside it, rather than at the projected
  // anchor — an ear is attached, and this is R2 again.
  const b=silPt(S,(s<0?Math.PI+0.92:2*Math.PI-0.92)+s*J.earDU[i]*7, 0.95);
  const F={x:b[0],y:b[1],...axes(S)};
  const k=J.earK[i];
  let base=unit*rr(0.082,0.108)*k, h=unit*rr(0.115,0.170)*k;
  if(type==="large")  { h*=1.32; base*=1.06; }
  if(type==="tall")   { h*=2.05; base*=0.84; }   // the lanky ones, kept on purpose
  if(type==="huge")   { h*=1.58; base*=1.24; }
  if(type==="small")  { h*=0.66; base*=0.92; }
  if(type==="folded") { h*=0.78; }
  const tip=place(F, s*base*J.earTilt, -h);
  let p;
  if(type==="torn"&&i===1)                       // one ear notched, not both
    p=[place(F,-base*0.9,0), place(F,s*base*J.earTilt*0.55,-h*0.55),
       place(F,s*base*J.earTilt*0.95,-h*0.72), tip, place(F,base*0.9,0)];
  else
    p=[place(F,-base*0.9,0), tip, place(F,base*0.9,0)];
  fillPts(p,col===PAPER?INK:PAPER,0.95);
  // An ear belongs to the silhouette, so it gets the silhouette's weight —
  // lighter than that and it reads as an antenna stuck on the skull.
  stroke(p,r,{w:3.0,passes:2,amp:0.014,col});
  if(type==="folded"){                            // a flap over the tip
    const f=[place(F,-base*0.75,-h*0.55), place(F,s*base*0.5,-h*1.05),
             place(F,base*0.85,-h*0.35)];
    fillPts(f,col===PAPER?INK:PAPER,0.95); stroke(f,r,{w:1.8,amp:0.04,col});
  }else if(type==="tufted"){                      // hairs out of the ear
    for(let t=-1;t<=1;t++) stroke([place(F,t*base*0.35,-h*0.25),
      place(F,t*base*0.55+s*base*0.2,-h*rr(0.85,1.25))],
      r,{w:1.1,passes:1,alpha:0.8,amp:0.06,col});
  }else{                                          // inner line
    stroke([place(F,-base*0.30,-base*0.15), place(F,s*base*J.earTilt*0.5,-h*0.60),
            place(F,base*0.30,-base*0.15)],r,{w:1.2,passes:1,alpha:0.65,amp:0.024,col});
  }
}

const CAT={
  name:"Cats", solid:"ellipsoid",
  shapes:["round","round","wide","wide","egg","square","peanut","lopsided",
           "pear","gourd","stone","slab","harmonic","mushroom"],
  build(r,S){
    const rr=R(r), pick=PICK(r), ch=CHANCE(r);
    const pair=(a,b)=>[rr(a,b),rr(a,b)];
    const J={
      eyeDU: pair(-0.014,0.014), eyeDV: pair(-0.05,0.05),
      eyeK:  pair(0.84,1.20),    eyeT:  pair(-0.30,0.30),
      earDU: pair(-0.022,0.022), earDV: pair(-0.055,0.055),
      earK:  pair(0.84,1.24),    earTilt: rr(0.05,0.55),
      whisk: pair(-0.02,0.02)
    };
    const kind=pick(CAT_NAMES), K=CAT_KINDS[kind];
    const es=K.eyes||pick(["open","open","open","wide","dot","closed","almond",
                           "sleepy","boggle","squint","star","spiral"]);
    const esp=rr(0.062,0.105);
    return { J, kind,
      coat: K.coat,
      earType: K.ears||pick(["normal","normal","normal","large","tall","small","tufted"]),
      eyeStyle: es, eyeSize: BIGEYES.has(es)? Math.min(1.15, 0.40+esp*7.0) : rr(0.85,1.25),
      mouthStyle: K.mouth||pick(["none","none","none","line","frown","smirk","zigzag"]),
      patch: !!K.patch, monocle: !!K.monocle, bowtie: !!K.bowtie,
      thirdEye: !!K.thirdEye, fangs: !!K.fangs || ch(0.10),
      eyeSpread: esp, eyeV: rr(-0.14,0.03),
      noseV: rr(0.14,0.26), muzzle: ch(0.82), whiskers: ch(0.85),
      collar: !K.bowtie && ch(0.24),
      tint: (K.coat==="void")?null:(ch(0.40)?pick(TINTS):null),
      tongue: ch(0.14), shade: ch(0.40)?Math.round(rr(14,28)):0,
      // furriness is a dial, not a coat name: a sphynx is 0 and a persian is 1,
      // and it drives the escaping hairs, the coat texture AND its density
      fur: Math.max(0,Math.min(1.25,(K.fur!==undefined?K.fur:0.40)+rr(-0.14,0.18))),
      coatTex: pick(["none","none","comb","comb","tuft","tuft","stipple",
                     "scribble","wave","pencil","shade","tooth","charcoal"])
    };
  },
  gates:[
    // A void cat IS its eyes. Shut them and the cell is a hole in the paper.
    ["void-blank", g=> !(g.coat==="void" &&
        ["closed","pinhole","squint","sleepy"].includes(g.eyeStyle))],
    // Ink drawn on ink is not drawn at all.
    ["invisible",  g=> !(g.coat==="void" && (g.monocle||g.patch||g.collar))],
    // An eyepatch over the only visible eye leaves nothing to look at.
    ["over-patch", g=> !(g.patch && ["closed","pinhole"].includes(g.eyeStyle))]
  ],
  tag: g=>g.kind,

  draw(r,S,g,unit){
    const rr=R(r), J=g.J;
    const sil=outline(S);
    const dark=g.coat==="void";
    const fc=dark?PAPER:INK;                      // feature colour

    if(g.tint) tintPatch(S,r,unit,g.tint,sil);

    // ears go on first, so the head outline crosses their base
    for(const [i,s] of [[0,-1],[1,1]]) catEar(S,r,unit,i,s,g.earType,J,fc);

    // ── coat ──────────────────────────────────────────────────────────
    if(dark){ fillPts(sil,INK,0.97); }
    else if(g.shade) clipTo(sil,()=>surfHatch(S,r,{v0:-0.35,v1:0.92,n:g.shade,
      du:0.05,dv:0.10,w:0.9,alpha:0.42,cut:-0.05}));
    // coat texture, scaled by how furry this animal is
    if(g.coatTex!=="none" && g.fur>0.12)
      clipTo(sil,()=>texture(g.coatTex,S,r,unit,{v0:-0.92,v1:0.92,
        dens:0.35+g.fur*1.15, col:fc, alpha:0.5}));
    stroke(sil,r,{w:3.0,passes:2,close:true,amp:0.012,col:dark?PAPER:INK});

    if(g.coat==="tuxedo"){                        // dark crown, light face
      const m=cap(S,{dir:-1,span:1,rad:rr(1.01,1.05),
        drop:Math.min(-0.24,Math.sin(g.eyeV*Math.PI/2)-0.20),...clumps(r)});
      fillPts(m,INK,0.95); stroke(m,r,{w:2.25,amp:0.017,close:true}); hairline(m,r,1.8);
    }
    if(g.coat==="points"){                        // dark muzzle and mask
      const P=anchor(S,0,0.30);
      const p=arc(...place(P,0,0),unit*0.145,unit*0.125,0,6.29,24);
      clipTo(p,()=>texture("comb",S,r,unit,{v0:0.05,v1:0.75,dens:1.6,col:fc,alpha:0.9}));
      clipTo(sil,()=>surfHatch(S,r,{v0:0.10,v1:0.70,n:26,du:0.012,dv:0.05,
                                    w:0.95,alpha:0.45,col:fc}));
    }
    if(g.coat==="patches") for(let i=0;i<Math.round(rr(2,4));i++){
      const a=rr(0,6.28), q=silPt(S,a,rr(0.30,0.72));
      const p=[];
      for(let k=0;k<=14;k++){const t=k/14*6.2832;
        const rad=unit*rr(0.055,0.105)*(1+0.28*Math.sin(3*t+a));
        p.push([q[0]+Math.cos(t)*rad, q[1]+Math.sin(t)*rad*0.82]);}
      fillPts(p,i%2?INK:TINTS[0],i%2?0.80:0.55);
    }
    // ── furriness ──────────────────────────────────────────────────────
    // One dial from sleek to cloud. Hairs escaping the OUTLINE do far more for
    // "furry" than anything drawn inside it, so the edge gets the budget.
    if(g.fur>0.10) furEdge(S,r,unit,sil,{upTo:1.0, n:Math.round(g.fur*38),
      len:0.016+0.026*g.fur, w:0.9+0.5*g.fur, col:fc});
    if(g.coat==="fluff" && g.fur>0.6){             // a second, longer layer
      const n=Math.round(g.fur*14);
      for(let i=0;i<n;i++){
        const a=rr(0,6.2832);
        stroke([silPt(S,a,1.00),silPt(S,a+rr(-0.07,0.07),1.06+0.10*g.fur)],
          r,{w:rr(1.0,1.6),alpha:0.75,amp:0.07,col:fc});
      }
    }
    if(g.coat==="bare") for(let i=0;i<3;i++){     // sphynx wrinkles
      const F=anchor(S,0,-0.34+i*0.10);
      if(F.facing>0.1) stroke([place(F,-unit*0.07,0),place(F,0,unit*0.012),
        place(F,unit*0.07,0)],r,{w:1.1,passes:1,alpha:0.6,amp:0.03,col:fc});
    }
    if(g.coat==="stripes"){
      const F=anchor(S,0,-0.42);
      if(F.facing>0.05) for(let i=-1;i<=1;i++)
        stroke([place(F,i*unit*0.06,0),place(F,i*unit*0.075,-unit*0.09)],
          r,{w:1.7,passes:1,alpha:0.8,amp:0.024,col:fc});
      for(const s of [-1,1]){
        const C=anchor(S,s*0.19,0.08);
        if(C.facing>0.05) for(let i=0;i<2;i++)
          stroke([place(C,s*unit*0.02,i*unit*0.05),place(C,s*unit*0.10,i*unit*0.05-unit*0.01)],
            r,{w:1.5,passes:1,alpha:0.7,amp:0.022,col:fc});
      }
    }

    // ── face ──────────────────────────────────────────────────────────
    for(const [i,s] of [[0,-1],[1,1]]){
      if(g.patch && i===0) continue;              // covered below
      const A0=anchor(S,s*(g.eyeSpread+J.eyeDU[i]),g.eyeV+J.eyeDV[i]);
      if(!seen(A0,ROLE.FEATURE)) continue;
      eye(pin(S,A0,0.74),r,s,{size:unit*0.095*g.eyeSize*J.eyeK[i]*(0.9+0.2*A0.facing),
        style:g.eyeStyle, col:fc, tilt:J.eyeT[i]*0.5, lid:anim.lid});
    }
    if(g.thirdEye){                               // straight up the forehead
      const T=anchor(S,0,-0.50);
      if(seen(T,ROLE.FEATURE))
        eye(pin(S,T,0.70),r,1,{size:unit*0.070,style:"ring",col:fc});
    }
    if(g.patch){                                  // eyepatch, plus its strap
      const A=pin(S,anchor(S,-(g.eyeSpread+0.01),g.eyeV),0.74);
      const p=arc(A.x,A.y,unit*0.070,unit*0.062,0,6.29,20);
      fillPts(p,INK,0.95); stroke(p,r,{w:1.6,close:true,amp:0.03});
      stroke([toForm(S,...place(A,-unit*0.10,-unit*0.03),1.0,"out"),
              toForm(S,...place(A, unit*0.22,-unit*0.05),1.0,"out")],
        r,{w:1.4,passes:1,alpha:0.85,amp:0.04});
    }
    if(g.monocle){
      const A=pin(S,anchor(S,g.eyeSpread+0.01,g.eyeV),0.76);
      stroke(arc(A.x,A.y,unit*0.075,unit*0.072,0,6.29,26),r,{w:1.6,close:true,amp:0.022});
      stroke([place(A,0,unit*0.075),place(A,-unit*0.02,unit*0.16)],
        r,{w:1.1,passes:1,alpha:0.8,amp:0.06});
    }

    const Nz=pin(S,anchor(S,0,g.noseV),0.70);
    if(seen(anchor(S,0,g.noseV),ROLE.FEATURE)){
      const p=[place(Nz,-unit*0.035,0),place(Nz,unit*0.035,0),place(Nz,0,unit*0.04)];
      fillPts(p,fc,0.92); stroke(p,r,{w:1.4,close:true,amp:0.021,col:fc});
      if(g.muzzle)
        stroke(arc(...place(Nz,0,unit*0.055),unit*0.05,unit*0.035,0.15,3.0,12),
          r,{w:1.6,amp:0.024,col:fc});
      if(g.tongue){ const p2=arc(...place(Nz,0,unit*0.10),unit*0.022,unit*0.030,0,3.14,10);
        fillPts(p2,TINTS[2],0.9); stroke(p2,r,{w:1.1,passes:1,amp:0.020,col:fc}); }
      if(g.fangs) for(const s of [-1,1]){         // two little teeth over the lip
        const p3=[place(Nz,s*unit*0.030,unit*0.055),place(Nz,s*unit*0.048,unit*0.055),
                  place(Nz,s*unit*0.038,unit*0.095)];
        fillPts(p3,dark?PAPER:PAPER,0.95); stroke(p3,r,{w:1.1,close:true,amp:0.03,col:fc});
      }
      if(g.whiskers) for(const [i,s] of [[0,-1],[1,1]]) for(let k=0;k<3;k++){
        // a fan from clear of the muzzle, rather than a parallel band across
        // the whole cheek starting at the nose
        const a=(k-1)*0.36+J.whisk[i]*5, L=unit*rr(0.16,0.25);
        const o=place(Nz,s*unit*0.075,unit*0.035+unit*J.whisk[i]);
        stroke([o,[o[0]+s*Math.cos(a)*L, o[1]+Math.sin(a)*L]],
          r,{w:1.1,alpha:0.70,amp:0.022,col:fc});
      }
    }
    if(g.mouthStyle!=="none"){
      const M0=anchor(S,0,g.noseV+0.22);
      if(seen(M0,ROLE.FEATURE))
        mouth(pin(S,M0,0.74),r,{w:unit*0.075,style:g.mouthStyle,col:fc});
    }
    if(g.bowtie){                                 // worn, so it hangs off the rim
      const C=anchor(S,0,0.96);
      const b=toForm(S,C.x,C.y,1.02,"out");
      for(const s of [-1,1]){
        const p=[[b[0],b[1]],[b[0]+s*unit*0.075,b[1]-unit*0.038],
                 [b[0]+s*unit*0.075,b[1]+unit*0.038]];
        fillPts(p,INK,0.92); stroke(p,r,{w:1.4,close:true,amp:0.035});
      }
      fillPts(arc(b[0],b[1],unit*0.018,unit*0.018,0,6.29,10),INK);
    }
    if(g.collar){                                 // hung off the chin, not floating
      const C=anchor(S,0,0.95), b=toForm(S,C.x,C.y,0.99,"out");
      const F={x:b[0],y:b[1],...axes(S)};
      stroke([place(F,-unit*0.15,-unit*0.012),place(F,0,unit*0.028),
              place(F,unit*0.15,-unit*0.012)],r,{w:2.5,amp:0.030});
      fillPts(arc(...place(F,0,unit*0.052),unit*0.018,unit*0.018,0,6.29,10),INK,0.9);
    }
  }
};
/* ---- SUBJECT: owls (ellipsoid + a facial disc, which is its own solid) ---- */
const OWL={
  name:"Owls", solid:"ellipsoid + disc",
  shapes:["round","round","egg","wide","acorn","bell","lumpy"], tag:g=>g.beak,
  build(r,S){ const rr=R(r),pick=PICK(r),ch=CHANCE(r);
    return {tufts:ch(0.6), discs:ch(0.85), beak:pick(["small","hook","wide"]),
      breast:pick(["none","hatch","chevron"]), feet:ch(0.7),
      eyeSize:rr(0.95,1.30), tint:ch(0.36)?pick(TINTS):null, brow:ch(0.5)};
  },
  draw(r,S,g,unit){
    const rr=R(r);
    const sil=outline(S);
    if(g.tint) tintPatch(S,r,unit,g.tint,sil,"body");
    if(g.tufts) for(const s of [-1,1]){
      const A=anchor(S,s*0.1,-0.7);
      if(A.facing>-0.15){
        const p=[place(A,-unit*0.06,0),place(A,s*unit*0.14,-unit*rr(0.16,0.26)),place(A,unit*0.06,0)];
        fillPts(p,PAPER); stroke(p,r,{w:1.9,amp:0.030});
      }
    }
    stroke(sil,r,{w:3.0,passes:2,close:true,amp:0.012});
    for(const s of [-1,1]){
      const A0=anchor(S,s*0.090,-0.12);
      if(A0.facing>0.05){
        const A=pin(S,A0,0.62);                  // R1: keep the disc on the form
        const sz=unit*0.085*g.eyeSize*(0.9+0.2*A.facing);
        if(g.discs) stroke(arc(A.x,A.y,sz*1.26,sz*1.22,0,6.29,30),r,{w:1.4,close:true,alpha:0.75,amp:0.018});
        stroke(arc(A.x,A.y,sz,sz,0,6.29,30),r,{w:2,close:true,amp:0.028});
        fillPts(arc(A.x,A.y,sz*0.55,sz*0.55,0,6.29,18),INK);
        fillPts(arc(A.x-sz*0.2,A.y-sz*0.2,sz*0.14,sz*0.14,0,6.29,10),PAPER,0.85);
        if(g.brow) stroke(arc(A.x,A.y,sz*1.2,sz*0.8,3.4,5.9,12),r,{w:1.8,amp:0.024});
      }
    }
    const B=anchor(S,0,0.06);
    if(B.facing>0){
      let p;
      if(g.beak==="hook") p=[place(B,-unit*0.03,-unit*0.02),place(B,unit*0.03,-unit*0.02),
                             place(B,unit*0.008,unit*0.075),place(B,-unit*0.02,unit*0.05)];
      else if(g.beak==="wide") p=[place(B,-unit*0.05,-unit*0.01),place(B,unit*0.05,-unit*0.01),place(B,0,unit*0.06)];
      else p=[place(B,-unit*0.028,-unit*0.015),place(B,unit*0.028,-unit*0.015),place(B,0,unit*0.055)];
      fillPts(p,TINTS[0],0.75); stroke(p,r,{w:1.7,close:true,amp:0.022});
    }
    const Br=anchor(S,0,0.5);
    if(Br.facing>0){
      if(g.breast==="hatch") hatch(Br.x,Br.y,unit*0.16,unit*0.13,r,{n:16,ang:1.3,len:0.45,w:0.9});
      if(g.breast==="chevron") for(let i=0;i<4;i++){
        const y=(i-1.5)*unit*0.05;
        stroke([place(Br,-unit*0.1,y),place(Br,0,y+unit*0.03),place(Br,unit*0.1,y)],
               r,{w:1.2,passes:1,alpha:0.7,amp:0.022});
      }
    }
    if(g.feet){ const F=anchor(S,0,0.97);
      for(const s of [-1,1]) for(let i=-1;i<=1;i++)
        stroke([place(F,s*unit*0.08,0),place(F,s*unit*0.08+i*unit*0.035,unit*0.055)],
               r,{w:1.6,passes:1,amp:0.022});
    }
  }
};

/* ---- SUBJECT: beetles (a tilted disc — radial, so legs come off the rim) ---- */
const BEETLE={
  name:"Beetles", solid:"tilted disc",
  shapes:["round","egg","long","wide","teardrop","lumpy"], tag:g=>g.spots,
  build(r,S){ const rr=R(r),pick=PICK(r),ch=CHANCE(r);
    return {legs:6, antennae:ch(0.9), spots:pick(["none","pair","many","stripe"]),
      pronotum:ch(0.85), split:ch(0.9), tint:ch(0.45)?pick(TINTS):null,
      legKink:rr(0.3,0.8), bodyFill:ch(0.25)};
  },
  draw(r,S,g,unit){
    const rr=R(r);
    // legs first, radiating from the rim of the disc so the body overlaps them
    for(let i=0;i<g.legs;i++){
      const s=i<3?-1:1, k=i%3;
      // u must match the side we push toward: u<0.5 is +x (right), u>0.5 is -x.
      const u=s<0?(0.75-k*0.03):(0.25+k*0.03);
      const v=-0.40+k*0.42;               // fore / mid / hind, not all at the waist
      const A=anchor(S,u,v);
      const knee=place(A,s*unit*0.15,-unit*0.03);
      const foot=place(A,s*unit*0.20*(0.7+g.legKink),unit*0.13);
      stroke([[A.x,A.y],knee,foot],r,{w:1.5,amp:0.026,alpha:0.95});
    }
    // elytra: the disc's own outline
    const sil=outline(S);
    if(g.tint) tintPatch(S,r,unit,g.tint,sil,"body");
    if(g.bodyFill) fillPts(sil,INK,0.82);
    stroke(sil,r,{w:3.0,passes:2,close:true,amp:0.011});
    if(g.split){ const T=anchor(S,0,-0.55), Bm=anchor(S,0,0.9);
      stroke([[T.x,T.y],[Bm.x,Bm.y]],r,{w:1.6,alpha:0.85,amp:0.024}); }
    if(g.pronotum){
      const P=anchor(S,0,-0.62);
      const p=arc(P.x,P.y,unit*0.11,unit*0.07,0,6.29,24);
      fillPts(p,g.bodyFill?INK:PAPER,g.bodyFill?1:0.9); stroke(p,r,{w:1.9,close:true,amp:0.026});
    }
    const H=anchor(S,0,-0.88);
    const hp=arc(H.x,H.y,unit*0.06,unit*0.045,0,6.29,20);
    fillPts(hp,INK,0.9); stroke(hp,r,{w:1.6,close:true,amp:0.022});
    if(g.antennae) for(const s of [-1,1])
      stroke([place(H,s*unit*0.03,-unit*0.02),place(H,s*unit*0.1,-unit*0.09),
              place(H,s*unit*0.15,-unit*0.075)],r,{w:1.2,passes:1,amp:0.024});
    if(g.spots==="pair"||g.spots==="many"){
      const n=g.spots==="pair"?2:6;
      for(let i=0;i<n;i++){
        const s=i%2?1:-1, row=Math.floor(i/2);
        const A=anchor(S,0.5+s*0.06,-0.15+row*0.32);
        if(A.facing>0.05) fillPts(arc(A.x,A.y,unit*0.03,unit*0.028,0,6.29,14),
          g.bodyFill?PAPER:INK,0.9);
      }
    }
    if(g.spots==="stripe") for(const s of [-1,1]){
      const A=anchor(S,0.5+s*0.07,0.1);
      if(A.facing>0.05) stroke([place(A,0,-unit*0.14),place(A,0,unit*0.16)],
        r,{w:2.6,passes:1,alpha:0.85,amp:0.024});
    }
  }
};


/* ── flowers ─────────────────────────────────────────────────────────────
   Built from photographs of real specimens, not from drawing guides. That
   distinction did real work here: almost every "how to draw a flower" source
   reduces the lot to a ring of ovals round a circle, and of the seven forms
   below exactly none actually work that way.

   What the photographs showed, and what each one forced:

   daisy       ~35 strap rays with BLUNT tips, in two overlapping ranks at
               visibly uneven lengths, each with a central crease. The disc is a
               granular domed cushion only about a quarter of the width.
   sunflower   the disc is not dots. It is thousands of tiny TUBES pointing
               outward, packed on two interlocking spiral families, getting
               smaller and tighter toward the middle.
   coneflower  a spiky dome whose florets break its own silhouette, and rays
               that DROOP steeply away from it, veined lengthwise.
   poppy       four broad tissue petals in a shallow BOWL, heavily overlapped,
               edges undulating, radial crease lines, and a tight dark ring of
               stamens around a pale capsule.
   iris        not radial at all — three standards arching up and inward, three
               broad falls hanging down and out, each fall with a pale beard.
   tulip       a closed spindle: tepals wrapped, long vertical seams, frayed tip.
   bluebell    an arching stem with bells hung along one side, each bell a
               narrow tube whose six tips curl sharply back.

   The radial heads hang off the same tilted-disc solid the beetles use, so
   petals are pinned by ANGLE in the disc's own plane and foreshorten properly
   when the head tips toward the light. The three non-radial forms get their own
   construction, because forcing them into a ring is exactly the mistake. */

const GOLDEN=Math.PI*(3-Math.sqrt(5));        // 137.5°, the phyllotactic angle
/* Colour where it belongs: petals take the flower tints, foliage is green, and
   a composite disc takes a warm ochre. Using one palette for all three was
   what made the earlier sheets read as monochrome drawings with a stain on
   them rather than as coloured ones. */
const FOLIAGE=["#7d8a6a","#8a9472","#6d7c5c","#94a07a"];
const POLLEN =["#b08a4a","#a8823c","#bd9a5c"];

/* Half-width of a petal along its length, base (0) to tip (1). */
function petalProfile(style,t){
  switch(style){
    case "strap":   return 0.44+0.56*Math.sin(Math.PI*Math.pow(t,0.75));
    case "blunt":   return Math.pow(Math.sin(Math.PI*Math.min(1,t*1.13)),0.40);
    case "pointed": return Math.sin(Math.PI*t)*(1-t*0.45);
    case "paddle":  return Math.pow(t,0.45)*(1-Math.pow(t,5))*1.20;
    case "broad":   return Math.pow(Math.sin(Math.PI*t),0.42);
    case "frill":   return Math.pow(Math.sin(Math.PI*t),0.50)*(1+0.17*Math.sin(t*19));
    case "notch":   return Math.pow(Math.sin(Math.PI*t),0.55)*(1-0.58*Math.pow(t,10));
    default:        return Math.pow(Math.sin(Math.PI*t),0.60);
  }
}
/* One petal, closed, in the disc's own plane. `bend` sweeps it round for a
   pinwheel; `lift` carries the tip out of the plane along the disc's axis,
   which is how a coneflower's droop and an iris standard's arch are made. */
function petalPts(S,a,r0,r1,hw,style,bend,lift){
  const N=13, out=[];
  const P=(t,sd)=>{
    const rad=r0+(r1-r0)*t, ang=a+bend*t*t+sd*hw*petalProfile(style,t);
    const k=rad*shapeR(S,ang);
    const q=project(S,[S.rx*k*Math.cos(ang), S.ry*k*Math.sin(ang), S.rz*lift*t*t]);
    return [q[0],q[1]];
  };
  for(let i=0;i<=N;i++) out.push(P(i/N,-1));
  for(let i=N;i>=0;i--) out.push(P(i/N, 1));
  return out;
}
/* A direction in the plant's OWN frame — an angle round the vertical axis and a
   length — carried through the rotation and handed back as a page offset plus a
   depth. This is what attaches a leaf to the armature: swing the flower and a
   leaf pointing at the viewer foreshortens toward nothing while one pointing
   sideways keeps its full length, and the depth says whether it passes in front
   of the stem or behind it.

   The stem itself stays in page space, because a stem answers to gravity rather
   than to the pose. The leaves answer to the pose. */
function radialDir(S,th,len,drop){
  const v=mul(S.M,[S.rx*len*Math.sin(th), S.ry*drop, S.rz*len*Math.cos(th)]);
  return [v[0],v[1],v[2]];
}
/* A leaf blade: a lens from its base along a page-space direction. */
function leafBlade(b,dx,dy,wid,curl){
  const L=Math.hypot(dx,dy)||1, ux=dx/L, uy=dy/L, nx=-uy, ny=ux, pts=[];
  for(let i=0;i<=10;i++){ const t=i/10, w=Math.sin(Math.PI*t)*wid+curl*Math.sin(Math.PI*t);
    pts.push([b[0]+ux*L*t+nx*w, b[1]+uy*L*t+ny*w]); }
  for(let i=10;i>=0;i--){ const t=i/10, w=Math.sin(Math.PI*t)*wid-curl*Math.sin(Math.PI*t);
    pts.push([b[0]+ux*L*t-nx*w, b[1]+uy*L*t-ny*w]); }
  return pts;
}
const discPt=(S,a,k,z=0)=>{
  const q=project(S,[S.rx*k*Math.cos(a),S.ry*k*Math.sin(a),S.rz*z]);
  return [q[0],q[1]];
};

/* ── centres ─────────────────────────────────────────────────────────── */
function flowerCentre(S,r,unit,g){
  const rr=R(r), cR=g.cR, kind=g.centre;
  if(kind==="none") return;
  if(kind==="eye"){
    const A={x:0,y:0,...axes(S)};
    eye(A,r,1,{size:S.rx*cR*0.60,style:g.eyeStyle,lid:anim.lid});
    return;
  }
  if(kind==="teeth"){                          // a ring of little fangs
    const n=Math.round(rr(9,15));
    for(let i=0;i<n;i++){
      const a=i/n*6.2832;
      const p=[discPt(S,a-0.10,cR*0.55),discPt(S,a+0.10,cR*0.55),discPt(S,a,cR*1.02)];
      fillPts(p,INK,0.9); stroke(p,r,{w:1.1,close:true,amp:0.03});
    }
    return;
  }
  if(kind==="stamens"){
    /* Poppy: a tight dark ANNULUS of stamens round a pale capsule — the ring is
       the read, not a filled dot. */
    const n=Math.round(rr(34,54));
    for(let i=0;i<n;i++){
      const a=rr(0,6.2832), k0=cR*rr(0.34,0.55), k1=cR*rr(0.86,1.10);
      stroke([discPt(S,a,k0),discPt(S,a+rr(-0.10,0.10),k1)],r,
        {w:rr(1.0,2.0),alpha:rr(0.7,1.0),amp:0.05});
    }
    const cap=arc(...discPt(S,0,0),S.rx*cR*0.36,S.ry*cR*0.30,0,6.29,18);
    fillPts(cap,PAPER,0.95); stroke(cap,r,{w:1.5,close:true,amp:0.03});
    for(let i=0;i<Math.round(rr(5,9));i++){     // the capsule's dark crown
      const a=i/7*6.2832;
      stroke([discPt(S,a,cR*0.10),discPt(S,a,cR*0.32)],r,{w:1.2,alpha:0.8,amp:0.05});
    }
    return;
  }
  if(kind==="cone"){
    /* Coneflower: a domed cushion whose florets break its own outline. */
    const dome=arc(...discPt(S,0,0),S.rx*cR*0.98,S.ry*cR*0.82,0,6.29,26);
    fillPts(dome,PAPER,0.9); stroke(dome,r,{w:2.0,close:true,amp:0.020});
    clipTo(dome,()=>pencilShade(S,r,unit,INK,
      {v0:-0.35,v1:0.35,dens:1.5,alpha:1.2,medium:"shade"}));
    const n=Math.round(rr(30,46));
    for(let i=0;i<n;i++){                       // spikes past the silhouette
      const a=i/n*6.2832+rr(-0.05,0.05);
      stroke([discPt(S,a,cR*0.80),discPt(S,a,cR*rr(1.02,1.20))],r,
        {w:rr(1.0,1.7),alpha:rr(0.75,1.0),amp:0.06});
    }
    return;
  }
  // "cushion" and "tubes": the composite disc, on the golden angle
  const n=Math.round((kind==="tubes"?rr(150,260):rr(90,170)));
  for(let i=0;i<n;i++){
    const f=Math.sqrt((i+0.5)/n), a=i*GOLDEN, k=f*cR;
    if(kind==="tubes"){
      // outward-pointing florets, growing as they go: what the macro showed
      const L=cR*0.055*(0.30+f);
      stroke([discPt(S,a,k),discPt(S,a,k+L)],r,
        {w:0.8+1.5*f,alpha:rr(0.55,1.0),amp:0.04});
    }else{
      const rad=S.rx*cR*0.075*(0.45+0.75*f);
      fillPts(arc(...discPt(S,a,k),rad,rad*0.9,0,6.29,7),INK,rr(0.45,0.95));
    }
  }
  const rim=arc(...discPt(S,0,0),S.rx*cR,S.ry*cR,0,6.29,24);
  if(g.centreTint){
    if(heavy()) clipTo(rim,()=>pencilShadeBox(rim,r,unit,g.centreTint,
      {dens:1.1,alpha:0.9,medium:"colour"}));
    else fillPts(rim,g.centreTint,0.28);
  }
  stroke(rim,r,{w:1.5,close:true,alpha:0.85,amp:0.022});
}

/* ── stem and leaves ─────────────────────────────────────────────────── */
function flowerStem(S,r,unit,g){
  const rr=R(r);
  const top=discPt(S,Math.PI/2,0.30);
  const len=unit*rr(0.70,1.12), bow=unit*rr(-0.14,0.18);
  const pts=[];
  for(let i=0;i<=9;i++){const t=i/9;
    pts.push([top[0]+bow*t*t, top[1]+len*t]);}
  if(g.leafTint) stroke(pts,r,{w:5.0,alpha:0.30,amp:0.020,col:g.leafTint});
  stroke(pts,r,{w:2.6,amp:0.020});
  if(g.bristly) for(let i=0;i<Math.round(rr(10,20));i++){
    const t=rr(0.05,1), b=[top[0]+bow*t*t, top[1]+len*t], sd=r()<0.5?-1:1;
    stroke([b,[b[0]+sd*unit*rr(0.010,0.022), b[1]-unit*rr(0.004,0.014)]],
      r,{w:0.9,alpha:0.7,amp:0.06});
  }
  /* Foliage is pinned to the armature. Each leaf gets an angle round the
     plant's vertical axis, so the pair swings and foreshortens with the pose
     instead of being stamped left-and-right in page space. Sorted by depth so
     the one behind the stem is drawn first. */
  const shade=lp=>{
    fillPts(lp,PAPER,0.9);
    if(!g.leafTint) return;
    if(heavy()) clipTo(lp,()=>pencilShadeBox(lp,r,unit,g.leafTint,
      {dens:0.95,alpha:0.85,medium:"colour"}));
    else fillPts(lp,g.leafTint,0.30);
  };
  /* Three candidate positions 120 degrees apart round the stem — alternate
     leaves, roughly how a stem actually carries them — each with a chance of
     being absent. */
  const set=[];
  for(let k=0;k<3;k++){
    if(r()<(g.palmate?0.42:0.30)) continue;
    const th=g.leafTh+k*2.0944+rr(-0.30,0.30);
    const t=g.palmate?rr(0.50,0.94):rr(0.26,0.88);
    set.push({th,t});
  }
  set.sort((a,b2)=>radialDir(S,a.th,1,0)[2]-radialDir(S,b2.th,1,0)[2]);

  for(const {th,t} of set){
    const b=[top[0]+bow*t*t, top[1]+len*t];
    if(g.palmate){
      /* Lupins carry palmate leaves: five to seven narrow leaflets radiating
         from one point like a hand. Distinctive enough that an oval leaf would
         give the whole thing away. */
      let d=radialDir(S,th,rr(0.36,0.52),rr(0.10,0.30));
      let reach=Math.hypot(d[0],d[1]);
      const floor2=unit*0.075;
      if(reach<1e-3) continue;
      if(reach<floor2){ const k2=floor2/reach; d=[d[0]*k2,d[1]*k2,d[2]]; reach=floor2; }
      const base=Math.atan2(d[1],d[0]);
      const nl=Math.round(rr(5,7.99));
      for(let i=0;i<nl;i++){
        const a=base+(i/(nl-1)-0.5)*1.45;
        const L=reach*rr(0.72,1.05);
        const lp=leafBlade(b,Math.cos(a)*L,Math.sin(a)*L,unit*0.016,0);
        shade(lp); stroke(lp,r,{w:1.6,close:true,amp:0.024});
      }
      continue;
    }
    let d=radialDir(S,th,rr(0.46,0.78),rr(0.18,0.44));
    /* Foreshortening is the point, but a leaf pointing dead at the viewer would
       collapse to nothing. Hold it to a floor so it still reads as a leaf. */
    const pl=Math.hypot(d[0],d[1]), floor=unit*0.085;
    if(pl<1e-3) continue;
    if(pl<floor){ const k2=floor/pl; d=[d[0]*k2,d[1]*k2,d[2]]; }
    const lp=leafBlade(b,d[0],d[1],unit*rr(0.032,0.056),unit*rr(-0.03,0.03));
    shade(lp); stroke(lp,r,{w:1.8,close:true,amp:0.024});
    stroke([b,[b[0]+d[0]*0.92,b[1]+d[1]*0.92]],r,{w:1.0,alpha:0.7,amp:0.03});
  }
}

/* ── bluebonnet ──────────────────────────────────────────────────────────
   From the photograph: a vertical SPIKE, florets set in whorled tiers round the
   stalk and pointing outward and slightly down, each one a rounded pea banner
   carrying a pale eye that goes magenta with age. The tip is a tight cluster of
   unopened cream buds pointing up, and the tiers loosen toward the bottom.

   Positions are taken round the spike's own axis and projected, so the florets
   on the far side foreshorten and sit behind — same trick as the petals, one
   axis over. */
function drawSpike(S,r,unit,g){
  const rr=R(r);
  const P=(y,th,rad)=>project(S,[S.rx*rad*Math.sin(th), S.ry*y, S.rz*rad*Math.cos(th)]);
  const top=-1.75*g.tall, bot=1.35;   // the spike gets the taller cell too
  const stalk=[], lean=rr(-0.10,0.10);
  for(let i=0;i<=8;i++){const t=i/8;
    const q=P(top+(bot-top)*t,lean*t,0); stalk.push([q[0],q[1]]);}
  stroke(stalk,r,{w:2.8,amp:0.02});

  const tiers=Math.round(rr(g.tiers[0],g.tiers[1]+0.99)), all=[];
  for(let i=0;i<tiers;i++){
    const t=i/(tiers-1);
    const y=top+0.34+(bot-top-0.34)*t;
    const per=Math.round(rr(3,5.99));
    const twist=i*2.399+rr(-0.2,0.2);            // each tier turned off the last
    for(let k=0;k<per;k++){
      const th=twist+k/per*6.2832+rr(-0.28,0.28);
      const rad=(0.40+0.50*t)*rr(0.78,1.22);     // looser lower down
      all.push({y:y+rr(-0.05,0.05),th,rad,age:t});
    }
  }
  all.sort((a,b)=>P(a.y,a.th,a.rad)[2]-P(b.y,b.th,b.rad)[2]);
  for(const f of all){
    const base=P(f.y,f.th,f.rad*0.30), tip=P(f.y+rr(0.02,0.09),f.th,f.rad);
    stroke([[base[0],base[1]],[tip[0],tip[1]]],r,{w:1.3,alpha:0.8,amp:0.05});
    const w=unit*rr(0.036,0.058)*g.fat, h=unit*rr(0.030,0.050)*g.fat;
    // a lopsided banner, not a bead: wider on one side and tilted off true
    const tw=rr(-0.7,0.7), ban=[];
    for(let k=0;k<=18;k++){
      const a2=k/18*6.2832, sq=1+0.24*Math.cos(a2+1.1);
      const dx=Math.cos(a2)*w*sq, dy=Math.sin(a2)*h*sq*(a2<Math.PI?1.12:0.88);
      ban.push([tip[0]+dx*Math.cos(tw)-dy*Math.sin(tw),
                tip[1]+dx*Math.sin(tw)+dy*Math.cos(tw)]);
    }
    if(g.tex==="solid") fillPts(ban,INK,0.92);
    else { fillPts(ban,PAPER,0.95);
           clipTo(ban,()=>pencilShadeBox(ban,r,unit,INK,
             {dens:1.0,alpha:0.95,medium:"pencil"})); }
    stroke(ban,r,{w:1.7,close:true,amp:0.024});
    if(g.tint){
      if(heavy()) clipTo(ban,()=>pencilShadeBox(ban,r,unit,g.tint,
        {dens:1.2,alpha:1.0,medium:"colour"}));
      else fillPts(ban,g.tint,0.30);
    }
    // the pale eye, which the photograph shows turning as the floret ages
    const ex=tip[0]+rr(-0.30,0.10)*w, ey=tip[1]-rr(0.10,0.40)*h;
    const spot=arc(ex,ey,w*rr(0.26,0.40),h*rr(0.24,0.38),0,6.29,10,tw);
    fillPts(spot,PAPER,0.95);
    if(f.age>0.55) clipTo(spot,()=>pencilShadeBox(spot,r,unit,TINTS[2],
      {dens:1.4,alpha:1.2,medium:"colour"}));
    stroke(spot,r,{w:1.0,alpha:0.7,amp:0.04});
  }
  // the unopened cream buds crowding the tip
  const nb=Math.round(rr(5,9.99));
  for(let i=0;i<nb;i++){
    const th=i*2.399, y=top+rr(0.0,0.26), rad=rr(0.06,0.22);
    const q=P(y,th,rad);
    const bud=arc(q[0],q[1],unit*rr(0.016,0.026),unit*rr(0.022,0.034),0,6.29,12,rr(-0.4,0.4));
    fillPts(bud,PAPER,0.95); stroke(bud,r,{w:1.4,close:true,amp:0.03});
  }
}

  // ── and the funk ──
  pinwheel:   {form:"ray", n:[7,11],  pet:"strap",  hw:0.72, r0:0.20, centre:"cushion", cR:0.20, bend:0.72},
  eyebloom:   {form:"ray", n:[10,15], pet:"blunt",  hw:0.82, r0:0.32, centre:"eye",     cR:0.32},
  spikeball:  {form:"ray", n:[22,34], pet:"pointed",hw:0.78, r0:0.12, centre:"none",    cR:0.12},
  toothbloom: {form:"ray", n:[9,13],  pet:"frill",  hw:0.96, r0:0.24, centre:"teeth",   cR:0.24},
  wilted:     {form:"ray", n:[6,9],   pet:"paddle", hw:0.92, r0:0.16, centre:"cushion", cR:0.16, lift:-0.95},
};
const FLOWER_NAMES=Object.keys(FLOWER_KINDS);

const FLOWER={
  name:"Flowers", solid:"tilted disc", rows:3,
  shapes:["round","round","round","lopsided","lumpy","harmonic","wide","egg"],
  build(r,S){
    const rr=R(r), pick=PICK(r), ch=CHANCE(r);
    const kind=pick(FLOWER_NAMES), K=FLOWER_KINDS[kind];
    const n=K.n?Math.round(rr(K.n[0],K.n[1]+0.99)):0;
    return { kind, form:K.form, n,
      pet:K.pet, r0:K.r0, centre:K.centre||"none", cR:K.cR||0.2,
      // hw arrives as a fraction of the angular slot, so 1.0 means the petals
      // just touch and anything above overlaps — which is what a poppy does
      hw:(K.hw||0.8)*Math.PI/Math.max(3,n),
      ranks:K.ranks||1, crease:!!K.crease, vein:!!K.vein, crumple:!!K.crumple,
      bristly:!!K.bristly, bend:K.bend||0, lift:K.lift||0, palmate:!!K.palmate,
      tiers:K.tiers||[7,11], fat:K.fat||1, tall:K.tall||1,
      /* Real heads are not lathe-turned. Petals sit at uneven angles, run to
         different lengths and widths, droop by different amounts, and a bloom
         of any age has usually lost one — a gap in the ring reads as far more
         alive than a perfect rosette does. */
      jit:Array.from({length:Math.max(1,n)},()=>({
        da:rr(-0.60,0.60), dl:rr(-0.20,0.13), dw:rr(-0.26,0.26),
        dz:rr(-0.40,0.40), gone:r()<0.06, torn:r()<0.11 })),
      cx:rr(-0.022,0.022), cy:rr(-0.022,0.022), rise:rr(0.28,0.42),
      spin:rr(0,6.2832), jag:rr(0.03,0.13),
      tex:pick(TEXTURES), eyeStyle:pick(EYES),
      tint:ch(0.74)?pick(TINTS):null,
      leafTint:ch(0.80)?pick(FOLIAGE):null,
      centreTint:ch(0.55)?pick(POLLEN):null,
      leafTh:rr(0,6.2832),                     // where the leaves sit round the stem
      stem:ch(0.78), shade:ch(0.45)
    };
  },
  gates:[
    // a bloom needs petals or a centre — ideally both
    ["empty", g=> g.form!=="ray" || g.n>0 || g.centre!=="none"],
    // an eye on a black disc is an eye nobody can see
    ["blind", g=> !(g.centre==="eye" && g.tex==="solid")]
  ],
  tag: g=>g.kind,

  draw(r,S,g,unit){
    const rr=R(r);
    // lift the head so a longer stem has somewhere to go
    if(g.stem && g.form!=="bells" && g.form!=="spike") ctx.translate(0,-unit*g.rise);
    if(g.form==="spike"){ if(g.stem) flowerStem(S,r,unit,g); drawSpike(S,r,unit,g); return; }
    if(g.stem && g.form!=="bells") flowerStem(S,r,unit,g);

    if(g.form==="cup"){
      /* Tulip: a closed spindle. Tepals wrapped, so what reads is the ogive
         silhouette plus the long vertical seams, and a slightly frayed point. */
      const w=S.rx*rr(0.62,0.86), h=S.ry*rr(1.05,1.30);
      const side=t=>Math.pow(Math.sin(Math.PI*Math.pow(t,0.72)),0.62);
      const pts=[];
      for(let i=0;i<=16;i++){const t=i/16;
        pts.push([-w*side(t), h*(1-2*t)]);}
      for(let i=16;i>=0;i--){const t=i/16;
        pts.push([ w*side(t), h*(1-2*t)]);}
      const bud=pts.map(q=>project(S,[q[0],q[1],0]).slice(0,2));
      if(g.tex==="solid") fillPts(bud,INK,0.95);
      else { fillPts(bud,PAPER); clipTo(bud,()=>texture(g.tex,S,r,unit,{dens:1.2})); }
      stroke(bud,r,{w:3.0,passes:2,close:true,amp:0.014});
      for(const sx of [-0.42,0.05,0.5]){        // the wrap seams
        const sp=[];
        for(let i=2;i<=15;i++){const t=i/16;
          sp.push(project(S,[sx*w*side(t)*0.92, h*(1-2*t),0]).slice(0,2));}
        stroke(sp,r,{w:1.4,alpha:0.8,amp:0.02});
      }
      if(g.tint) clipTo(bud,()=>pencilShade(S,r,unit,g.tint,
        {dens:1.3,alpha:1.05,medium:"colour"}));
      return;
    }

    if(g.form==="bells"){
      /* Bluebell: the stem arches and the bells hang along ONE side. */
      const sd=r()<0.5?-1:1;
      const arc0=[];
      for(let i=0;i<=12;i++){const t=i/12;
        arc0.push([sd*S.rx*(1.15*t-0.15), -S.ry*0.85+S.ry*1.5*t*t]);}
      const spine=arc0.map(q=>project(S,[q[0],q[1],0]).slice(0,2));
      stroke(spine,r,{w:2.6,amp:0.02});
      const n=Math.round(rr(4,8));
      for(let i=0;i<n;i++){
        const t=0.18+0.72*i/Math.max(1,n-1);
        const b=spine[Math.round(t*12)];
        const L=unit*rr(0.10,0.17), W=unit*rr(0.020,0.032);
        const bell=[];                          // narrow tube, hanging
        for(let k=0;k<=8;k++){const u=k/8;
          bell.push([b[0]-W*(0.45+0.55*Math.sin(Math.PI*Math.min(1,u*1.1))), b[1]+L*u]);}
        for(let k=8;k>=0;k--){const u=k/8;
          bell.push([b[0]+W*(0.45+0.55*Math.sin(Math.PI*Math.min(1,u*1.1))), b[1]+L*u]);}
        fillPts(bell,PAPER,0.92);
        clipTo(bell,()=>pencilShadeBox(bell,r,unit,INK,
          {dens:0.9,alpha:0.8,medium:g.tex==="solid"?"shade":"pencil"}));
        stroke(bell,r,{w:2.0,close:true,amp:0.02});
        for(const s2 of [-1,1]) for(const kk of [0.5,1.0])   // tips curling BACK
          stroke([[b[0]+s2*W*kk*0.9,b[1]+L*0.92],
                  [b[0]+s2*W*kk*2.2,b[1]+L*rr(1.06,1.22)],
                  [b[0]+s2*W*kk*1.5,b[1]+L*rr(0.74,0.90)]],
            r,{w:1.5,alpha:0.95,amp:0.06});
        if(g.tint){
          if(heavy()) clipTo(bell,()=>pencilShadeBox(bell,r,unit,g.tint,
            {dens:1.1,alpha:1.05,medium:"colour"}));
          else fillPts(bell,g.tint,0.30);
        }
      }
      return;
    }

    if(g.form==="iris"){
      /* Three standards arching UP and inward, three falls hanging DOWN and
         out, each fall carrying a pale beard. Nothing about this is a ring. */
      /* First attempt spaced all six petals evenly at 120 degrees and got a
         six-petal rosette — the exact mistake the photograph warned against.
         An iris is organised VERTICALLY: three falls hang down and out, three
         standards stand up and arch inward. Both groups cluster in their own
         half of the page, they do not share a ring. */
      const DOWN=Math.PI/2, UP=-Math.PI/2;
      const grp=(base,offs,lift,style,hw,rad,wt)=>{
        for(const o of offs){
          const a=base+o+rr(-0.07,0.07);
          const p=petalPts(S,a,0.10,rad*rr(0.92,1.06),hw,style,rr(-0.10,0.10),lift);
          if(g.tex==="solid") fillPts(p,INK,0.92);
          else { fillPts(p,PAPER,0.95);
                 clipTo(p,()=>pencilShadeBox(p,r,unit,INK,
                   {dens:0.9,alpha:0.8,medium:"pencil"})); }
          stroke(p,r,{w:wt,close:true,amp:0.018});
          for(let k=-1;k<=1;k++)                // lengthwise veining
            stroke([discPt(S,a+k*hw*0.45,0.16),discPt(S,a+k*hw*0.52,rad*0.88)],
              r,{w:1.0,alpha:0.55,amp:0.03});
          if(g.tint) clipTo(p,()=>pencilShadeBox(p,r,unit,g.tint,
            {dens:1.15,alpha:1.0,medium:"colour"}));
        }
      };
      const FALLS=[-0.90,0,0.90], STANDS=[-0.80,0,0.80];
      grp(DOWN, FALLS, -0.55, "paddle", 0.62, 1.04, 2.6);   // falls, drawn first
      grp(UP,  STANDS,  0.75, "broad",  0.50, 0.68, 2.4);   // standards, in front
      for(const o of FALLS){                     // the pale beard, on the falls
        const a=DOWN+o;
        for(let k=0;k<8;k++) stroke([discPt(S,a+rr(-0.09,0.09),0.20+k*0.052),
          discPt(S,a+rr(-0.09,0.09),0.25+k*0.052)],r,{w:1.5,alpha:0.8,amp:0.06});
      }
      return;
    }

    /* ── radial heads ──────────────────────────────────────────────────
       Depth-sorted so the near petals lie over the far ones, which is the only
       thing that makes a tilted head read as a solid object rather than a
       flat rosette. */
    const slot=Math.PI/Math.max(3,g.n);
    const order=[];
    for(let i=0;i<g.n;i++){
      if(g.jit[i].gone) continue;                 // a missing petal
      const a=i/g.n*6.2832+g.spin+g.jit[i].da*slot;
      order.push({a, i, z:project(S,[S.rx*0.8*Math.cos(a),S.ry*0.8*Math.sin(a),0])[2]});
    }
    order.sort((p,q)=>p.z-q.z);

    for(let rank=(heavy()?g.ranks-1:0);rank>=0;rank--){
      const off=rank*slot*0.85, sc=rank?0.86:1;
      for(const {a,i} of order){
        const J=g.jit[i];
        const r1=((rank?0.90:1.01)+J.dl)*sc + (g.crumple?rr(-0.06,0.06):0)
                 - (J.torn?rr(0.10,0.24):0);
        const p=petalPts(S,a+off,g.r0,r1,g.hw*(rank?0.9:1)*(1+J.dw),g.pet,
                         g.bend+rr(-g.jag,g.jag)*0.3, g.lift*(1+J.dz));
        if(g.tex==="solid") fillPts(p,INK,0.92);
        else {
          fillPts(p,PAPER,0.94);
          if(g.shade && heavy()) clipTo(p,()=>pencilShadeBox(p,r,unit,INK,
            {dens:0.7,alpha:0.65,medium:"pencil"}));
        }
        stroke(p,r,{w:rank?1.9:2.5,close:true,amp:0.016});
        if(g.crease)                            // the daisy's central fold
          stroke([discPt(S,a+off,g.r0+0.05),discPt(S,a+off,r1*0.90)],
            r,{w:1.0,alpha:0.5,amp:0.03});
        if(g.vein) for(const k of [-0.45,0,0.45])
          stroke([discPt(S,a+off+k*g.hw,g.r0+0.04),
                  discPt(S,a+off+k*g.hw*1.1,r1*0.88)],r,{w:0.9,alpha:0.45,amp:0.03});
        if(g.crumple) for(let c=0;c<4;c++){     // poppy tissue creases
          const kk=rr(-0.75,0.75);
          stroke([discPt(S,a+off+kk*g.hw,g.r0+0.05),
                  discPt(S,a+off+kk*g.hw*1.25,r1*rr(0.72,0.96))],
            r,{w:1.0,alpha:rr(0.35,0.7),amp:0.04});
        }
        if(g.tint && (heavy()||i%2===0)) clipTo(p,()=>pencilShadeBox(p,r,unit,g.tint,
          {dens:rr(0.9,1.3),alpha:1.0,medium:"colour"}));
      }
    }
    ctx.save(); ctx.translate(g.cx*unit,g.cy*unit);   // discs sit off-centre
    flowerCentre(S,r,unit,g);
    ctx.restore();
  }
};

const SUBJECTS=[HEAD,CAT,FLOWER,OWL,BEETLE];
let subject=0, sheetSeed=Math.floor(Math.random()*1e9), cellSeeds=[], turn=0, showArm=false;
let gateHits={}, gateTotal=0, gaveUp=0;     // what the rules layer threw away
let toolTally={};                           // which utensils this sheet used
/* Which reroll passed the gates, per cell. The outcome is seed-driven and does
   not change from frame to frame, but the loop was re-running up to MAX_TRIES
   builds per cell EVERY frame to rediscover it. Caching the winning index means
   an animated frame does exactly one build per cell. */
let tryCache=new Map();

/* ── paper: built once, reused. No image assets. ─────────────────────────
   Fibre, blotch, crumple — and cloud, which turned out to be most of it. */
let paperTex=null;

/* One octave of value noise. Built the cheap way: fill a tiny canvas with one
   random value per cell and let the browser's own bilinear upscale do the
   interpolation for free. Warm greys darken, near-whites lift. */
function cloudOctave(c,w,h,cells,alpha,r,dark){
  const t=document.createElement("canvas");
  t.width=cells; t.height=Math.max(2,Math.round(cells*h/w));
  const tc=t.getContext("2d");
  for(let y=0;y<t.height;y++) for(let x=0;x<t.width;x++){
    tc.fillStyle=dark?`rgba(152,142,120,${r()})`:`rgba(255,253,247,${r()})`;
    tc.fillRect(x,y,1,1);
  }
  c.save(); c.globalAlpha=alpha; c.imageSmoothingEnabled=true;
  c.drawImage(t,0,0,w,h); c.restore();
}
function makePaper(w,h){
  const p=document.createElement("canvas"); p.width=w; p.height=h;
  const c=p.getContext("2d");
  c.fillStyle=PAPER; c.fillRect(0,0,w,h);
  const r=rng(7);
  /* Cloud, coarse to fine. This is the thing that was missing: a flat colour
     with dots on it reads as a canvas element, whereas a few octaves of slow
     tonal drift read as a sheet of paper that has been somewhere. Warm greys
     for the hollows, near-white for the highs, so it mottles in both
     directions rather than just getting dirty. */
  cloudOctave(c,w,h, 4,0.15,r,true);
  cloudOctave(c,w,h, 6,0.17,r,false);
  cloudOctave(c,w,h,11,0.11,r,true);
  cloudOctave(c,w,h,25,0.07,r,true);
  for(let i=0;i<26000;i++){                      // fine tooth
    const x=r()*w,y=r()*h,a=r()*0.05;
    c.fillStyle=r()<0.5?`rgba(90,80,60,${a})`:`rgba(255,255,255,${a*1.4})`;
    c.fillRect(x,y,1.3,1.3);
  }
  for(let i=0;i<260;i++){                        // longer fibres
    const x=r()*w,y=r()*h,L=8+r()*46,a=r()*6.28;
    c.strokeStyle=`rgba(120,105,80,${0.03+r()*0.05})`; c.lineWidth=0.9;
    c.beginPath(); c.moveTo(x,y); c.lineTo(x+Math.cos(a)*L,y+Math.sin(a)*L); c.stroke();
  }
  for(let i=0;i<15;i++){                         // faint blotches
    const x=r()*w,y=r()*h,rad=90+r()*260;
    const gd=c.createRadialGradient(x,y,0,x,y,rad);
    gd.addColorStop(0,`rgba(150,130,100,${0.02+r()*0.03})`); gd.addColorStop(1,"rgba(150,130,100,0)");
    c.fillStyle=gd; c.fillRect(x-rad,y-rad,rad*2,rad*2);
  }
  /* Crumple. The thing that makes a crease read as a crease rather than a
     scratch is that it comes in PAIRS: the ridge catches the light on one side
     and shadows on the other, one pixel apart. Drawn twice, offset, at very low
     alpha — a sheet that has been folded once and flattened out again, not
     screwed into a ball. */
  for(let i=0;i<9;i++){
    const x0=r()*w, y0=r()*h, a=r()*6.2832, L=h*(0.45+r()*0.95), bow=w*0.010;
    const seg=[], n=18;
    for(let k=0;k<=n;k++){                       // a crease wanders, never rules
      const t=k/n, s2=Math.sin(t*3.4+i*1.7)*bow + Math.sin(t*9+i)*bow*0.35;
      seg.push([x0+Math.cos(a)*L*t + Math.sin(a)*s2,
                y0+Math.sin(a)*L*t - Math.cos(a)*s2]);
    }
    for(const [dx,dy,rgb,al] of [[-1,-1,"255,255,255",0.055],[1,1,"92,82,62",0.048]]){
      c.strokeStyle=`rgba(${rgb},${al})`; c.lineWidth=1.7;
      c.beginPath();
      seg.forEach((q,k)=>k?c.lineTo(q[0]+dx,q[1]+dy):c.moveTo(q[0]+dx,q[1]+dy));
      c.stroke();
    }
  }
  for(let i=0;i<4;i++){                          // broad soft panels between creases
    const x=r()*w, y=r()*h, rad=w*(0.28+r()*0.30);
    const gd=c.createRadialGradient(x,y,0,x,y,rad);
    gd.addColorStop(0,`rgba(255,255,255,${0.016+r()*0.014})`);
    gd.addColorStop(1,"rgba(255,255,255,0)");
    c.fillStyle=gd; c.fillRect(x-rad,y-rad,rad*2,rad*2);
  }
  for(let i=0;i<34;i++){                         // foxing: small age blooms
    const x=r()*w, y=r()*h, rad=3+r()*17;
    const gd=c.createRadialGradient(x,y,0,x,y,rad);
    gd.addColorStop(0,`rgba(148,116,76,${0.05+r()*0.10})`);
    gd.addColorStop(0.55,`rgba(148,116,76,${0.02+r()*0.05})`);
    gd.addColorStop(1,"rgba(148,116,76,0)");
    c.fillStyle=gd; c.fillRect(x-rad,y-rad,rad*2,rad*2);
  }
  // the edges of a sheet see more handling than the middle
  const vg=c.createRadialGradient(w/2,h/2,Math.min(w,h)*0.28,
                                  w/2,h/2,Math.max(w,h)*0.70);
  vg.addColorStop(0,"rgba(94,84,66,0)");
  vg.addColorStop(1,"rgba(94,84,66,0.09)");
  c.fillStyle=vg; c.fillRect(0,0,w,h);
  return p;
}

function drawArmature(S,unit){
  ctx.save(); ctx.globalAlpha=0.5; ctx.strokeStyle=TINTS[0]; ctx.lineWidth=1;
  for(let k=-2;k<=2;k++){                         // latitudes
    const v=k/3, pts=[];
    for(let i=0;i<=44;i++){const q=project(S,onSolid(S,i/44,v)); if(mul(S.M,normalAt(S,i/44,v))[2]>0) pts.push(q);}
    ctx.beginPath(); pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1])); ctx.stroke();
  }
  for(let k=0;k<6;k++){                           // longitudes
    const u=k/12, pts=[];
    for(let i=0;i<=24;i++){const v=-1+2*i/24; const q=project(S,onSolid(S,u,v));
      if(mul(S.M,normalAt(S,u,v))[2]>0) pts.push(q);}
    ctx.beginPath(); pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1])); ctx.stroke();
  }
  ctx.restore();
}

function drawCell(idx){
  const W=cv.width, H=cv.height, cw=W/cols, chh=H/rows;
  const cx=(idx%cols+0.5)*cw, cy=(Math.floor(idx/cols)+0.5)*chh;
  const S0=SUBJECTS[subject], seed=cellSeeds[idx];

  /* Geometry first, on its own stream, so the gates below are allowed to look
     at the solid without their rerolls disturbing the pose.

     Height is normalised: ry is fixed, width and depth vary. So a long
     specimen reads as NARROW rather than bigger — character without footprint
     creep, which matters on a grid. (Yan Liu's fix.) */
  const rg=rng((seed^0x5bf03635)>>>0), rrg=R(rg), pickg=PICK(rg);
  // one utensil for this whole specimen — see the media library above
  tool=pickg(MEDIA);
  const fk=S0.fillK||[0.84,0.92];
  const unit=Math.min(cw,chh)*rrg(fk[0],fk[1]);
  const ry=unit*(S0.ryK||0.355);
  /* Height stays normalised, but the footprint gets to be strange: a squat
     wide skull and a narrow tall one are different animals, and holding both
     at the same height keeps them from bullying the grid. */
  const asp={norm:[0.78,1.04],norm2:[0.78,1.04],norm3:[0.78,1.04],
             wide:[1.12,1.48], narrow:[0.56,0.72], deep:[0.90,1.10]}[
             pickg(["norm","norm2","norm3","norm","wide","narrow","deep"])];
  const rx=ry*rrg(asp[0],asp[1]), rz=ry*rrg(0.78,1.16);
  /* Per-cell phase, so forty specimens do not move as one. Everything below
     is a small offset on the POSE — the head looks around and the features come
     with it for free, because they were never in page space to begin with. */
  const ph=((seed>>>5)%1024)/1024*6.2832;
  const T=animT;
  anim.wig  = playing? Math.sin(T*0.90+ph)               : 0;
  // the hair lags the head by a beat: secondary motion, and the whole reason
  // a bounce reads as weight rather than as the drawing sliding about
  anim.hair = playing? Math.sin(T*0.90+ph-0.75)          : 0;
  anim.smile= playing? Math.pow(Math.max(0,Math.sin(T*0.33+ph*3.1)),3) : 0;
  // a blink is a sharp pulse, not a sine: shut fast, open fast, then nothing
  const bt=(T*0.42+ph*0.37)%1;
  anim.lid  = playing&&bt<0.055? Math.sin(bt/0.055*Math.PI) : 0;

  const yaw=(turn*Math.PI/180)+rrg(-0.5,0.5)+anim.wig*0.10;
  const pitch=rrg(-0.26,0.22)+(playing?Math.sin(T*0.71+ph*1.7)*0.045:0);
  const roll=rrg(-0.12,0.12)+(playing?Math.sin(T*0.53+ph*2.3)*0.035:0);
  const S={rx,ry,rz,unit,M:rot(yaw,pitch,roll),
           shape:pickg(S0.shapes||["round"]), r1:rg(),
           // coefficients for the "harmonic" silhouette, kept small enough
           // that the outline cannot fold through itself
           harm:Array.from({length:4},(_,i)=>[rrg(0.02,0.105)/(1+i*0.55), rg()*6.283])};
  toolTally[tool]=(toolTally[tool]||0)+1;

  /* The rules layer, spec half: build, judge, reroll. `build` advances its own
     rng and `draw` continues from where it stopped, so the accepted stream has
     to be the one that gets handed on — not a fresh one from the same seed. */
  let g=null, r=null, tries=0;
  const ck=subject+":"+seed, hit=tryCache.get(ck);
  if(hit!==undefined){                        // we already know which one won
    r=rng((seed+hit*0x9E3779B9)>>>0); g=S0.build(r,S); tries=hit;
  }else{
    for(; tries<MAX_TRIES; tries++){
      const rt=rng((seed+tries*0x9E3779B9)>>>0);
      const cand=S0.build(rt,S);
      const bad=(S0.gates||[]).find(([,ok])=>!ok(cand,S));
      if(!bad){ g=cand; r=rt; break; }
      gateHits[bad[0]]=(gateHits[bad[0]]||0)+1; gateTotal++;
    }
    if(g) tryCache.set(ck,tries);
    else { r=rng(seed); g=S0.build(r,S); gaveUp++; }  // drawn anyway, and counted
  }

  ctx.save();
  ctx.translate(cx+rrg(-cw*0.02,cw*0.02), cy+rrg(-chh*0.02,chh*0.02));
  if(showArm) drawArmature(S,unit);
  S0.draw(r,S,g,unit);
  ctx.restore();
}

function render(){
  const W=cv.width,H=cv.height;
  if(!paperTex||paperTex.width!==W) paperTex=makePaper(W,H);
  ctx.clearRect(0,0,W,H); ctx.drawImage(paperTex,0,0);
  if(!tryCache.size){ gateHits={}; gateTotal=0; gaveUp=0; }
  toolTally={};
  for(let i=0;i<N;i++) drawCell(i);
  document.getElementById("seedout").textContent=sheetSeed.toString(36);
  document.getElementById("countout").textContent=N;
  const hits=Object.entries(gateHits).sort((a,b)=>b[1]-a[1])
    .map(([k,v])=>`${k} ${v}`).join(" · ");
  document.getElementById("gateout").textContent =
    gateTotal ? `${gateTotal} rejected — ${hits}${gaveUp?` · gave up ${gaveUp}`:""}`
              : "nothing rejected";
  document.getElementById("toolout").textContent =
    Object.entries(toolTally).sort((a,b)=>b[1]-a[1])
      .map(([k,v])=>`${k} ${v}`).join(" · ");
  tool="pen";
}
function newSheet(){
  tryCache.clear();
  sheetSeed=Math.floor(Math.random()*1e9);
  const r=rng(sheetSeed);
  cellSeeds=Array.from({length:N},()=>Math.floor(r()*1e9));
  render();
}

/* ── controls ─────────────────────────────────────────────────────────── */
const tabs=document.getElementById("tabs");
SUBJECTS.forEach((s,i)=>{
  const b=document.createElement("button");
  b.innerHTML=`${s.name}<span class="tab-solid">${s.solid}</span>`;
  b.setAttribute("aria-pressed",i===0?"true":"false");
  b.onclick=()=>{subject=i; gridFor(i); tryCache.clear();
    [...tabs.children].forEach((c,j)=>c.setAttribute("aria-pressed",j===i?"true":"false"));
    newSheet();};
  tabs.appendChild(b);
});
/* ── the loop ─────────────────────────────────────────────────────────────
   Pinned to 30fps rather than run flat out. Left uncapped, the frame rate
   varied from 26 to 68 depending on the subject, and since the motion is driven
   off wall-clock time the drawings all moved at the same SPEED but with visibly
   different smoothness. A fixed budget is steadier and leaves the machine some
   headroom.

   The warm-up exists because the first second used to crawl. Two causes: the
   JIT has not been through the drawing path yet, and the gate loop has not
   filled its cache. Both are one-time costs, so they get paid up front behind a
   label instead of being smeared over the opening of the animation. */
const FPS=30, FRAME=1000/FPS, WARM=8;
let animStart=0, lastFrame=0, warming=0;
function frame(now){
  if(!playing) return;
  if(warming>0){
    render();                                  // same path the animation uses
    if(--warming===0){ animStart=now; lastFrame=0; playBtn.textContent="Pause"; }
    else playBtn.textContent="Warming "+warming;
    requestAnimationFrame(frame); return;
  }
  if(!animStart) animStart=now;
  if(now-lastFrame>=FRAME-1.5){                // -1.5 so we do not miss a vsync
    lastFrame=now; animT=(now-animStart)/1000; render();
  }
  requestAnimationFrame(frame);
}
const playBtn=document.getElementById("play");
function setPlaying(v){
  playing=v; playBtn.setAttribute("aria-pressed",v);
  if(v){ warming=WARM; animStart=0; playBtn.textContent="Warming "+WARM;
         requestAnimationFrame(frame); }
  else { warming=0; animT=0; playBtn.textContent="Animate"; render(); }
}
playBtn.onclick=()=>setPlaying(!playing);
document.getElementById("reroll").onclick=newSheet;
document.getElementById("turn").oninput=e=>{turn=+e.target.value; render();};
const armBtn=document.getElementById("armature");
armBtn.onclick=()=>{showArm=!showArm; armBtn.setAttribute("aria-pressed",showArm); render();};
cv.onclick=e=>{
  const b=cv.getBoundingClientRect();
  const col=Math.floor((e.clientX-b.left)/b.width*cols), row=Math.floor((e.clientY-b.top)/b.height*rows);
  const i=row*cols+col; if(i<0||i>=N) return;
  cellSeeds[i]=Math.floor(Math.random()*1e9);
  render();
};
gridFor(subject);   // the first sheet needs its grid too
newSheet();
</script>
